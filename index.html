<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Desmosify</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <main>
      <h1>Desmosify</h1>

      <section class="card">
        <label id="drop" class="drop" for="file">
          <input id="file" type="file" accept="video/mp4,video/quicktime,video/webm,video/x-matroska,.mp4,.mov,.webm,.mkv" />
          <span id="fileName">Select a video</span>
        </label>
        <div class="row">
          <span id="renderInfo" class="metrics"></span>
          <button id="render" class="ghost" disabled>Render</button>
          <button id="run" disabled>Convert</button>
        </div>
        <p id="notice" class="notice" hidden></p>

        <details>
          <summary>Settings</summary>
          <div class="grid">
            <label>Frames <input id="frames" type="number" value="40" min="1" max="400" /></label>
            <label>FPS <input id="fps" type="number" value="8" min="1" max="30" /></label>
            <label>Width px <input id="width" type="number" value="200" min="48" max="640" /></label>
            <label>Clip budget <input id="detail" type="number" value="9000" min="400" max="9800" step="100" /></label>
            <label>Clip contours <input id="contours" type="number" value="48" min="4" max="128" step="4" /></label>
            <label>Edge cutoff <input id="sensitivity" type="number" value="0.6" min="0.3" max="0.95" step="0.05" /></label>
          </div>
          <label class="toggle">
            <input id="smooth" type="checkbox" checked />
            Smooth curves
          </label>
        </details>
      </section>

      <section id="preview" class="card" hidden>
        <div class="row">
          <button id="play" class="ghost">Play</button>
          <input id="scrub" type="range" min="0" max="0" value="0" />
          <span id="frameLabel" class="metrics"></span>
        </div>
        <div id="stage">
          <div id="calculator"></div>
          <canvas id="overlay" hidden></canvas>
        </div>
        <label class="toggle">
          <input id="overlayToggle" type="checkbox" />
          Show source frame
        </label>
      </section>

      <section id="out" class="card" hidden>
        <div class="row">
          <h2>Export</h2>
          <select id="exportMode">
            <option value="frame">Current frame (exact)</option>
            <option value="clip">Whole clip (compact)</option>
          </select>
          <button id="copy" class="ghost">Copy</button>
        </div>
        <textarea id="latex" readonly spellcheck="false"></textarea>
      </section>
    </main>

    <dialog id="renderDialog" class="modal">
      <form method="dialog">
        <h2>Render video</h2>
        <div class="grid">
          <label title="Output height">Size
            <select id="renderSize">
              <option value="source">Source</option>
              <option value="1080">1080p</option>
              <option value="720">720p</option>
              <option value="480">480p</option>
              <option value="360">360p</option>
            </select>
          </label>
          <label title="Multiple of the render size">Detail ×
            <input id="detailScale" type="number" value="1" min="0.25" max="2" step="0.25" />
          </label>
          <label>Line width
            <input id="lineWidth" type="number" value="3" min="1" max="24" step="1" />
          </label>
        </div>
        <label class="toggle">
          <input id="renderAudio" type="checkbox" />
          Include source audio
        </label>
        <div class="row">
          <button id="renderCancel" class="ghost" type="button">Cancel</button>
          <button id="renderGo" type="button">Render</button>
        </div>
      </form>
    </dialog>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
